#bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:floatBlob 18s ease-in-out infinite;}
.blob1{width:38vw;height:38vw;background:var(--primary);top:-10%;right:-8%;animation-duration:20s;}
.blob2{width:32vw;height:32vw;background:var(--accent);bottom:-12%;left:-10%;animation-duration:24s;animation-delay:-4s;}
.blob3{width:24vw;height:24vw;background:var(--secondary);top:40%;left:35%;animation-duration:16s;animation-delay:-8s;}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(4%,6%) scale(1.08);}66%{transform:translate(-5%,-3%) scale(.95);}}
.particle{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,var(--glow));opacity:.6;animation:drift linear infinite;}
@keyframes drift{from{transform:translateY(0) translateX(0);}to{transform:translateY(-110vh) translateX(20px);}}
.ripple{position:fixed;border-radius:50%;border:1px solid var(--glow);pointer-events:none;transform:translate(-50%,-50%);animation:rippleOut 1s ease-out forwards;z-index:5;}
@keyframes rippleOut{from{width:0;height:0;opacity:.6;}to{width:220px;height:220px;opacity:0;}}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-border);box-shadow:0 8px 32px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,.6);border-radius:28px;}
.hidden{display:none !important;}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
::selection{background:var(--glow);}
#lockScreen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;transition:opacity .9s ease, filter .9s ease;}
#lockScreen.melt{opacity:0;filter:blur(20px);pointer-events:none;}
.lock-orb{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;color:var(--primary);cursor:pointer;position:relative;animation:breathe 4s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.lock-orb.shake{animation:shakeLock .5s ease;}
@keyframes shakeLock{0%,100%{transform:translateX(0) rotate(0);}20%{transform:translateX(-10px) rotate(-4deg);}40%{transform:translateX(10px) rotate(4deg);}60%{transform:translateX(-6px) rotate(-2deg);}80%{transform:translateX(6px) rotate(2deg);}}
.lock-hint{font-size:18px;color:#7a6aa3;letter-spacing:1px;}
.lock-error{min-height:50px;text-align:center;font-size:17px;color:#a081d6;opacity:0;transition:opacity .4s;}
.lock-error.show{opacity:1;}
#keypadWrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
#nameSelect{display:flex;gap:16px;}
.name-pill{padding:12px 26px;border-radius:20px;font-size:18px;}
.name-pill.active{background:var(--primary);color:#fff;}
#pinDots{display:flex;gap:12px;justify-content:center;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--primary);transition:.25s;}
.pin-dot.filled{background:var(--primary);}
#keypad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
.key{width:64px;height:64px;border-radius:20px;font-size:22px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.key:active{transform:scale(.9);background:var(--glow);}
#welcomeScreen{position:fixed;inset:0;z-index:19;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s;}
#welcomeScreen.show{opacity:1;pointer-events:all;}
#welcomeText{font-size:clamp(26px,6vw,52px);text-align:center;line-height:1.6;color:var(--primary);text-shadow:0 4px 20px var(--shadow-color);padding:20px;}
#welcomeText .ch{opacity:0;display:inline-block;animation:chIn .5s forwards;}
@keyframes chIn{to{opacity:1;transform:translateY(0);}from{transform:translateY(10px);}}
#app{position:relative;z-index:2;min-height:100vh;padding:24px 18px 130px;opacity:0;transition:opacity 1s;}
#app.show{opacity:1;}
.page{display:none;max-width:960px;margin:0 auto;animation:pageIn .5s ease;}
.page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
h1.page-title{font-size:clamp(24px,4vw,34px);color:var(--primary);margin-bottom:18px;text-align:center;}
.card{padding:22px;margin-bottom:18px;}
#dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:8px;padding:10px 16px;max-width:94vw;overflow-x:auto;}
#dock::-webkit-scrollbar{display:none;}
.dock-btn{width:54px;height:54px;min-width:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:21px;transition:transform .2s;position:relative;}
.dock-btn:hover,.dock-btn.active{transform:translateY(-8px) scale(1.12);background:var(--glass);}
.dock-btn .tip{position:absolute;bottom:64px;font-size:11px;background:var(--primary);color:#fff;padding:4px 10px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;}
.dock-btn:hover .tip{opacity:1;}
.subnav{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;}
.subnav::-webkit-scrollbar{display:none;}
.subtab-btn{padding:9px 18px;border-radius:16px;font-size:14px;white-space:nowrap;background:rgba(255,255,255,.4);}
.subtab-btn.active{background:var(--primary);color:#fff;}
.subpage{display:none;}
.subpage.active{display:block;animation:pageIn .4s ease;}
.gift-box{width:200px;height:200px;margin:40px auto;position:relative;cursor:pointer;}
.gift-lid{position:absolute;top:0;left:0;right:0;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 10px 30px var(--shadow-color);transition:transform .6s ease, opacity .6s;}
.gift-body{position:absolute;bottom:0;left:10px;right:10px;height:140px;border-radius:16px;background:linear-gradient(135deg,var(--secondary),var(--accent));box-shadow:0 10px 30px var(--shadow-color);}
.ribbon-v{position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);background:var(--white);opacity:.85;}
.ribbon-h{position:absolute;left:0;right:0;top:60px;height:22px;background:var(--white);opacity:.85;}
.gift-box.opened .gift-lid{transform:translateY(-160px) rotate(-25deg);opacity:0;}
.petal{position:fixed;pointer-events:none;z-index:30;font-size:18px;animation:petalFall 2.2s ease-in forwards;}
@keyframes petalFall{to{transform:translateY(90vh) rotate(360deg);opacity:0;}}
#giftContent{max-width:520px;margin:20px auto 0;text-align:center;opacity:0;transition:opacity 1s;max-height:60vh;overflow-y:auto;padding:4px 4px 20px;}
#giftContent.show{opacity:1;}
#giftLetter{white-space:pre-wrap;line-height:1.9;font-size:17px;}
#giftMedia img{max-width:100%;height:auto;border-radius:20px;margin-top:14px;display:block;margin-left:auto;margin-right:auto;}
.timeline{position:relative;padding-right:26px;border-right:3px solid var(--glow);}
.mem-item{margin-bottom:22px;padding:16px 20px;cursor:pointer;position:relative;}
.mem-item::before{content:'✦';position:absolute;right:-38px;top:18px;color:var(--primary);font-size:18px;}
.mem-item .mem-date{font-size:13px;color:var(--secondary);}
.mem-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.mem-item.open .mem-body{max-height:400px;margin-top:10px;}
.jar{width:150px;height:190px;margin:10px auto;border-radius:16px 16px 40px 40px;border:4px solid var(--primary);position:relative;overflow:hidden;background:rgba(255,255,255,.3);}
.jar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--accent),var(--primary));transition:height 1s ease;opacity:.7;}
.jar-note{background:var(--white);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px;box-shadow:0 4px 14px var(--shadow-color);}
.masonry{columns:2;column-gap:14px;}
@media(min-width:700px){.masonry{columns:3;}}
.masonry .card{break-inside:avoid;padding:0;overflow:hidden;margin-bottom:14px;}
.masonry img{width:100%;display:block;border-radius:28px;}
.mcap{padding:12px;font-size:13px;}
.bucket-item{display:flex;align-items:center;gap:12px;padding:14px 18px;margin-bottom:10px;}
.bucket-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bucket-check.done{background:var(--primary);color:#fff;}
.bucket-item.done span.blabel{text-decoration:line-through;opacity:.5;}
.envelope{padding:22px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
.wax{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.field{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--glass-border);background:rgba(255,255,255,.5);margin-bottom:10px;font-family:'Segoe UI',Tahoma,Arial,sans-serif !important;font-size:15px;color:#4a3b6e;}
textarea.field{resize:vertical;min-height:90px;}
.btn-main{padding:12px 26px;border-radius:18px;background:var(--primary);color:#fff;font-size:15px;box-shadow:0 6px 18px var(--shadow-color);transition:transform .15s;font-family:'Segoe UI',Tahoma,Arial,sans-serif !important;}
.btn-main:active{transform:scale(.95);}
.subtab-btn,.name-pill,.key,.dock-btn,.gm-item button{font-family:'Segoe UI',Tahoma,Arial,sans-serif !important;}
.chat-wrap{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto;padding:10px;}
.bubble{max-width:75%;padding:10px 16px;border-radius:20px;font-size:15px;}
.bubble.me{align-self:flex-start;background:var(--primary);color:#fff;border-bottom-left-radius:6px;}
.bubble.them{align-self:flex-end;background:var(--white);border-bottom-right-radius:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;}}
.stat-num{font-size:30px;color:var(--primary);}
.stat-label{font-size:13px;color:#7a6aa3;}
input[type=range]{width:100%;accent-color:var(--primary);}
.gm-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;margin-bottom:8px;}
.gm-item button{color:var(--primary);font-size:13px;}
label.small{font-size:13px;color:#7a6aa3;display:block;margin-bottom:4px;}
</style>
</head>
<body>
<div id="bgLayer"></div>

<div id="lockScreen">
  <div class="lock-orb glass" id="lockOrb">✦</div>
  <div class="lock-hint" id="lockHint">المس القفل لتبدأ ⟡</div>
  <div id="keypadWrap" class="hidden">
    <div id="nameSelect">
      <button class="name-pill glass active" data-user="ratooj">رتوج</button>
      <button class="name-pill glass" data-user="ahmed">أحمد</button>
    </div>
    <div id="pinDots"></div>
    <div id="keypad" class="glass"></div>
  </div>
  <div class="lock-error" id="lockError">لاااا... جرب مرة ثانية ✦</div>
</div>

<div id="welcomeScreen"><div id="welcomeText"></div></div>

<div id="app">

  <div class="page active" id="page-home">
    <h1 class="page-title">✦ بيتنا ✦</h1>
    <div class="card glass" style="text-align:center;">
      <p id="homeGreeting" style="font-size:20px;"></p>
      <div id="liveCounter" style="margin-top:10px;font-size:clamp(15px,3.4vw,22px);color:var(--primary);"></div>
    </div>
    <div class="grid2">
      <div class="card glass"><div class="stat-num" id="statDays">0</div><div class="stat-label">يوم مع بعض ✦</div></div>
      <div class="card glass"><div class="stat-num" id="statMem">0</div><div class="stat-label">ذكرى محفوظة ❀</div></div>
    </div>
    <div class="card glass" style="text-align:center;">
      <button class="btn-main" id="missYouBtn" onclick="sendMissYou()">♡ اشتقتلك ♡</button>
      <div id="missYouStatus" style="margin-top:8px;font-size:13px;color:#7a6aa3;"></div>
    </div>
  </div>

  <div class="page" id="page-gift">
    <h1 class="page-title">❀ هدية اليوم ❀</h1>
    <div class="gift-box" id="giftBox">
      <div class="gift-body"></div><div class="gift-lid"></div>
      <div class="ribbon-v"></div><div class="ribbon-h"></div>
    </div>
    <div id="giftContent">
      <p id="giftLetter"></p>
      <div id="giftMedia"></div>
    </div>
    <div id="giftResetWrap" class="hidden" style="text-align:center;margin-top:14px;">
      <button class="btn-main" onclick="resetGift()">إعادة تعيين الهدية ✦</button>
    </div>
    <h1 class="page-title" style="margin-top:36px;font-size:20px;">✦ هدايا سابقة ✦</h1>
    <div id="giftHistory"></div>
  </div>

  <div class="page" id="page-together">
    <h1 class="page-title">☾ سوا ☾</h1>
    <div class="subnav">
      <button class="subtab-btn active" data-sub="mem">ذكرياتنا</button>
      <button class="subtab-btn" data-sub="space">بيتنا</button>
      <button class="subtab-btn" data-sub="chat">الرسائل</button>
      <button class="subtab-btn" data-sub="letters">رسائل سرية</button>
      <button class="subtab-btn" data-sub="jar">برطمان الحب</button>
      <button class="subtab-btn" data-sub="bucket">أحلامنا</button>
    </div>

    <div class="subpage active" id="sub-mem">
      <div class="timeline" id="memTimeline"></div>
      <div class="card glass">
        <input class="field" id="memTitle" placeholder="عنوان الذكرى">
        <input class="field" id="memDate" type="date">
        <textarea class="field" id="memText" placeholder="اكتب الذكرى هنا..."></textarea>
        <button class="btn-main" onclick="addMemory()">إضافة ذكرى ✦</button>
      </div>
    </div>

    <div class="subpage" id="sub-space">
      <div class="grid2">
        <div class="card glass"><h3>رتوج</h3><p id="statusRatooj" style="margin:8px 0;color:#7a6aa3;">لا يوجد حالة</p>
          <div id="ratoojStatusForm"><input class="field" id="inputRatooj" placeholder="اكتبي حالتك..."><button class="btn-main" onclick="updateStatus('ratooj')">تحديث</button></div></div>
        <div class="card glass"><h3>أحمد</h3><p id="statusAhmed" style="margin:8px 0;color:#7a6aa3;">لا يوجد حالة</p>
          <div id="ahmedStatusForm"><input class="field" id="inputAhmed" placeholder="اكتب حالتك..."><button class="btn-main" onclick="updateStatus('ahmed')">تحديث</button></div></div>
      </div>
    </div>

    <div class="subpage" id="sub-chat">
      <div class="card glass">
        <div class="chat-wrap" id="chatWrap"></div>
        <div style="display:flex;gap:8px;margin-top:10px;">
          <input class="field" id="msgInput" placeholder="اكتب رسالة..." style="margin-bottom:0;">
          <button class="btn-main" onclick="sendMsg()">إرسال</button>
        </div>
      </div>
    </div>

    <div class="subpage" id="sub-letters">
      <div class="card glass">
        <textarea class="field" id="letterText" placeholder="اكتب رسالتك السرية..."></textarea>
        <input class="field" id="letterDate" type="date">
        <button class="btn-main" onclick="addLetter()">ختم وإرسال ✦</button>
      </div>
      <div id="letterList"></div>
    </div>

    <div class="subpage" id="sub-jar">
      <div class="jar glass"><div class="jar-fill" id="jarFill" style="height:0%"></div></div>
      <div class="card glass">
        <input class="field" id="jarInput" placeholder="لماذا تحبني اليوم؟">
        <button class="btn-main" onclick="addJarNote()">إضافة ✦</button>
        <div id="jarNotes" style="margin-top:14px;"></div>
      </div>
    </div>

    <div class="subpage" id="sub-bucket">
      <div class="card glass">
        <input class="field" id="bucketInput" placeholder="حلم جديد نحققه سوا">
        <button class="btn-main" onclick="addBucket()">إضافة ✦</button>
      </div>
      <div id="bucketList"></div>
    </div>
  </div>

  <div class="page" id="page-media">
    <h1 class="page-title">❦ الوسائط ❦</h1>
    <div class="subnav">
      <button class="subtab-btn active" data-sub="gallery">المعرض</button>
      <button class="subtab-btn" data-sub="music">الموسيقى</button>
      <button class="subtab-btn" data-sub="cal">التقويم</button>
    </div>

    <div class="subpage active" id="sub-gallery">
      <div class="card glass hidden" id="adminGalleryForm">
        <input class="field" id="galUrl" placeholder="رابط الصورة">
        <input class="field" id="galCap" placeholder="وصف الصورة">
        <button class="btn-main" onclick="addImage()">إضافة صورة ✦</button>
      </div>
      <div class="masonry" id="masonry"></div>
    </div>

    <div class="subpage" id="sub-music">
      <div class="card glass">
        <input class="field" id="ytUrlInput" placeholder="الصق رابط فيديو يوتيوب هنا">
        <div id="ytError" style="color:#a081d6;font-size:13px;margin-bottom:8px;"></div>
        <div id="ytPlayerCard" class="hidden" style="text-align:center;">
          <img id="ytThumb" style="width:100%;max-width:260px;border-radius:20px;margin:0 auto 10px;display:block;">
          <div id="ytTitle" style="font-size:15px;margin-bottom:10px;"></div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="btn-main" id="ytPlayBtn" onclick="ytTogglePlay()">▶</button>
            <input type="range" id="ytSeek" min="0" max="100" value="0" style="flex:1;">
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#7a6aa3;margin-top:4px;">
            <span id="ytCurrent">0:00</span><span id="ytDuration">0:00</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
            <button class="btn-main" onclick="ytSeekBy(-10)">⟲10</button>
            <button class="btn-main" onclick="ytSeekBy(10)">10⟳</button>
            <button class="btn-main" id="ytMuteBtn" onclick="ytToggleMute()">🔊</button>
            <input type="range" id="ytVolume" min="0" max="100" value="80" style="flex:1;">
          </div>
        </div>
        <div id="ytAudioEngine" style="width:1px;height:1px;overflow:hidden;position:absolute;opacity:0;pointer-events:none;"></div>
      </div>
      <div class="card glass">
        <input class="field" id="musicTitle" placeholder="اسم مخصص (اختياري)">
        <button class="btn-main" onclick="saveCurrentSong()">حفظ في القائمة ✦</button>
      </div>
      <div id="songList"></div>
    </div>

    <div class="subpage" id="sub-cal">
      <div class="card glass hidden" id="adminCalForm">
        <input class="field" id="calTitle" placeholder="اسم المناسبة">
        <input class="field" id="calDate" type="date">
        <button class="btn-main" onclick="addEvent()">إضافة مناسبة ✦</button>
      </div>
      <div id="eventList"></div>
    </div>
  </div>

  <div class="page" id="page-admin">
    <h1 class="page-title">⚙ لوحة أحمد ⚙</h1>
    <div class="subnav">
      <button class="subtab-btn active" data-sub="giftmaker">صانع الهدية</button>
      <button class="subtab-btn" data-sub="general">عام</button>
      <button class="subtab-btn" data-sub="integ">تكامل</button>
    </div>

    <div class="subpage active" id="sub-giftmaker">
      <div class="card glass">
        <label class="small">تاريخ الهدية</label>
        <input class="field" id="gmDate" type="date">
        <label class="small">نص الرسالة</label>
        <textarea class="field" id="gmLetter" placeholder="اكتب رسالة الهدية..."></textarea>
        <label class="small">رابط صورة (اختياري)</label>
        <input class="field" id="gmImage" placeholder="رابط الصورة">
        <label class="small">رابط أغنية (اختياري - يوتيوب أو mp3)</label>
        <input class="field" id="gmSong" placeholder="رابط الأغنية">
        <button class="btn-main" onclick="addGiftDay()">حفظ هدية هذا اليوم ✦</button>
      </div>
      <div id="giftDayList"></div>
    </div>

    <div class="subpage" id="sub-general">
      <div class="card glass">
        <label class="small">تاريخ بداية العلاقة</label>
        <input class="field" id="relDate" type="date">
        <label class="small">رسالة ترحيب رتوج</label>
        <textarea class="field" id="welcomeRatoojInput"></textarea>
        <label class="small">رسالة ترحيب أحمد</label>
        <textarea class="field" id="welcomeAhmedInput"></textarea>
        <label class="small">شدة الحركة</label>
        <input type="range" id="animRange" min="0" max="2" step="1" value="1">
        <button class="btn-main" onclick="saveSettings()" style="margin-top:10px;">حفظ ✦</button>
      </div>
    </div>

    <div class="subpage" id="sub-integ">
      <div class="card glass">
        <label class="small">رابط Discord Webhook</label>
        <input class="field" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
        <label class="small">JSONBin Bin ID</label>
        <input class="field" id="binId" placeholder="bin id">
        <label class="small">JSONBin Master/Access Key</label>
        <input class="field" id="binKey" placeholder="api key">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">

function daysTogether(){const start=new Date(db.relDate);const now=new Date();return Math.max(0,Math.floor((now-start)/86400000));}

function updateLiveCounter(){
  const start=new Date(db.relDate),now=new Date();
  let diff=Math.max(0,now-start);
  const d=Math.floor(diff/86400000);diff-=d*86400000;
  const h=Math.floor(diff/3600000);diff-=h*3600000;
  const m=Math.floor(diff/60000);diff-=m*60000;
  const s=Math.floor(diff/1000);
  const el=document.getElementById('liveCounter');
  if(el) el.textContent=d+' يوم ✦ '+h+' ساعة ✦ '+m+' دقيقة ✦ '+s+' ثانية';
}
setInterval(updateLiveCounter,1000);

function silentPullThenMaybePush(){
  if(!db.binId||!db.binKey)return;
  fetch('https://api.jsonbin.io/v3/b/'+db.binId+'/latest',{headers:{'X-Master-Key':db.binKey}})
    .then(r=>r.json()).then(data=>{
      const remote=data.record;
      if(remote && remote.updatedAt && remote.updatedAt > db.updatedAt){
        db=Object.assign(defaultDB(),remote);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        renderAll();
        restoreGiftState();
      }else{
        fetch('https://api.jsonbin.io/v3/b/'+db.binId,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':db.binKey},body:JSON.stringify(db)}).catch(()=>{});
      }
    }).catch(()=>{});
}

function renderGiftInner(){
    const g=db.giftDays[todayKey()];
    const letter=g&&g.letter ? g.letter : getDailyLetter();

    if(g&&g.song){
      const musicWrap=document.createElement('div');
      musicWrap.style.marginTop='16px';
      musicWrap.innerHTML='<div class="tenor-gif-embed" data-postid="23307400" data-share-method="host" data-aspect-ratio="0.99375" data-width="160" style="margin:0 auto 10px;border-radius:20px;overflow:hidden;"><a href="https://tenor.com/view/frkst-records-music-label-art-gif-23307400">Frkst Records Sticker</a> from <a href="https://tenor.com/search/frkst-stickers">Frkst Stickers</a></div>';

      media.appendChild(giftAudio);
      playGiftSong(g.song);

}
function getDailyLetter(){
  const letters=["كل يوم معك هدية بحد ذاتها ✦\nأحبك أكثر من أمس وأقل من بكرة ❀","مافي شي أحلى من إنك بحياتي ⟡\nأنتي هديتي كل يوم ✧","يومك اليوم هدية مني ليك ❦\nمهما بعدنا، قلبي دايم عندك ☾"];

function typeLetter(text){const el=document.getElementById('giftLetter');el.textContent='';let i=0;const iv=setInterval(()=>{el.textContent+=text[i];i++;if(i>=text.length)clearInterval(iv);},35);}
function burstPetals(){const petals=['❀','✿','❁','✦','❃'];for(let i=0;i<26;i++){const p=document.createElement('div');p.className='petal';p.textContent=petals[Math.floor(Math.random()*petals.length)];p.style.left=Math.random()*100+'vw';p.style.top='-10px';p.style.animationDelay=(Math.random()*0.6)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),3000);}}

/* music: custom YouTube audio player */
let currentSongIndex=0;
function ytId(url){const m=url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
let ytPlayer=null, ytApiReady=false, ytPollTimer=null, ytCurrentTitle='', ytCurrentThumb='';
function onYouTubeIframeAPIReady(){ ytApiReady=true; }
function fmtTime(sec){ sec=Math.floor(sec||0); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function loadYtUrl(url, customTitle){
  const errBox=document.getElementById('ytError');
  errBox.textContent='';
  const id=ytId(url);
  if(!id){ errBox.textContent='الرابط غير صالح — يرجى لصق رابط فيديو يوتيوب صحيح'; return; }
  document.getElementById('ytPlayerCard').classList.remove('hidden');
  fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+id+'&format=json')
    .then(r=>{ if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(data=>{
      ytCurrentTitle=customTitle||data.title||'أغنية';
      ytCurrentThumb=data.thumbnail_url||'';
      document.getElementById('ytTitle').textContent=ytCurrentTitle;
      document.getElementById('ytThumb').src=ytCurrentThumb;
    }).catch(()=>{
      ytCurrentTitle=customTitle||'أغنية';
      document.getElementById('ytTitle').textContent=ytCurrentTitle;
      document.getElementById('ytThumb').src='';
    });
  function startPlayer(){
    if(!ytApiReady){ setTimeout(startPlayer,300); return; }
    if(ytPlayer){
      ytPlayer.loadVideoById(id);
    }else{
      ytPlayer=new YT.Player('ytAudioEngine',{
        height:'1',width:'1',videoId:id,
        playerVars:{autoplay:1,controls:0},
        events:{
          onReady:()=>{ ytPlayer.setVolume(80); document.getElementById('ytVolume').value=80; startPolling(); },
          onStateChange:(e)=>{ document.getElementById('ytPlayBtn').textContent = e.data===1 ? '⏸' : '▶'; },
          onError:()=>{ errBox.textContent='تعذر تشغيل هذا الفيديو — قد يكون خاصًا أو غير متاح'; }
        }
      });
    }
  }
  startPlayer();
}
function startPolling(){
  clearInterval(ytPollTimer);
  ytPollTimer=setInterval(()=>{
    if(!ytPlayer||!ytPlayer.getDuration)return;
    const dur=ytPlayer.getDuration()||0, cur=ytPlayer.getCurrentTime()||0;
    document.getElementById('ytDuration').textContent=fmtTime(dur);
    document.getElementById('ytCurrent').textContent=fmtTime(cur);
    if(dur>0) document.getElementById('ytSeek').value=(cur/dur)*100;
  },500);
}
function ytTogglePlay(){
  if(!ytPlayer)return;
  const state=ytPlayer.getPlayerState();
  if(state===1){ ytPlayer.pauseVideo(); } else { ytPlayer.playVideo(); }
}
function ytSeekBy(sec){
  if(!ytPlayer)return;
  ytPlayer.seekTo(Math.max(0,(ytPlayer.getCurrentTime()||0)+sec),true);
}
document.getElementById('ytSeek').addEventListener('input',(e)=>{
  if(!ytPlayer||!ytPlayer.getDuration)return;
  const dur=ytPlayer.getDuration()||0;
  ytPlayer.seekTo((e.target.value/100)*dur,true);
});
document.getElementById('ytVolume').addEventListener('input',(e)=>{
  if(!ytPlayer)return;
  ytPlayer.setVolume(+e.target.value);
  document.getElementById('ytMuteBtn').textContent = (+e.target.value===0) ? '🔇' : '🔊';
});
function ytToggleMute(){
  if(!ytPlayer)return;
  if(ytPlayer.isMuted()){ ytPlayer.unMute(); document.getElementById('ytMuteBtn').textContent='🔊'; }
  else{ ytPlayer.mute(); document.getElementById('ytMuteBtn').textContent='🔇'; }
}
document.getElementById('ytUrlInput').addEventListener('input',(e)=>{
  const val=e.target.value.trim();
  if(ytId(val)) loadYtUrl(val,'');
});
function saveCurrentSong(){
  const url=document.getElementById('ytUrlInput').value.trim();
  if(!ytId(url)){ document.getElementById('ytError').textContent='الصق رابط يوتيوب صحيح أولاً'; return; }
  const title=document.getElementById('musicTitle').value.trim()||ytCurrentTitle||'أغنية';
  db.songs.push({title,url});
  saveDB();
  document.getElementById('musicTitle').value='';
  renderSongs();
}
function renderSongs(){
  const wrap=document.getElementById('songList');if(!wrap)return;wrap.innerHTML='';
  db.songs.forEach((s,i)=>{const el=document.createElement('div');el.className='card glass';el.style.cursor='pointer';el.innerHTML='<strong>'+s.title+'</strong>';el.onclick=()=>{document.getElementById('ytUrlInput').value=s.url;loadYtUrl(s.url,s.title);};wrap.appendChild(el);});
}

/* webhook + sync */
function sendWebhook(content){
  if(!db.webhookUrl)return;
  fetch(db.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content})}).catch(()=>{});
}
function pushToCloud(){
  const status=document.getElementById('syncStatus');
  if(!db.binId||!db.binKey){status.textContent='أدخل Bin ID والمفتاح أولاً';return;}
  status.textContent='جاري الرفع...';
  fetch('https://api.jsonbin.io/v3/b/'+db.binId,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':db.binKey},body:JSON.stringify(db)})
    .then(r=>r.json()).then(()=>{status.textContent='تم الرفع بنجاح ✦';}).catch(()=>{status.textContent='فشل الرفع';});
}
function pullFromCloud(){
  const status=document.getElementById('syncStatus');
  if(!db.binId||!db.binKey){status.textContent='أدخل Bin ID والمفتاح أولاً';return;}
  status.textContent='جاري السحب...';
  fetch('https://api.jsonbin.io/v3/b/'+db.binId+'/latest',{headers:{'X-Master-Key':db.binKey}})
    .then(r=>r.json()).then(data=>{const remote=data.record;if(remote){db=Object.assign(defaultDB(),remote);saveDB();renderAll();status.textContent='تم السحب بنجاح ✦';}})
    .catch(()=>{status.textContent='فشل السحب';});
}
function saveIntegrations(){
  if(!isAdmin())return;
  db.webhookUrl=document.getElementById('webhookUrl').value.trim();
  db.binId=document.getElementById('binId').value.trim();
  db.binKey=document.getElementById('binKey').value.trim();
  saveDB();document.getElementById('syncStatus').textContent='تم الحفظ ✦';
}

/* settings */
function saveSettings(){
  if(!isAdmin())return;
  db.relDate=document.getElementById('relDate').value||db.relDate;
  db.welcomeRatooj=document.getElementById('welcomeRatoojInput').value||db.welcomeRatooj;
  db.welcomeAhmed=document.getElementById('welcomeAhmedInput').value||db.welcomeAhmed;
  db.animLevel=+document.getElementById('animRange').value;
  saveDB();applyAnimLevel();renderHome();updateLiveCounter();
}
function applyAnimLevel(){
  document.querySelectorAll('.blob').forEach(b=>{b.style.animationPlayState=db.animLevel===0?'paused':'running';});
}

/* secret miss-you feature removed per user request */

function renderAll(){
  document.getElementById('relDate').value=db.relDate;
  document.getElementById('welcomeRatoojInput').value=db.welcomeRatooj;
  document.getElementById('welcomeAhmedInput').value=db.welcomeAhmed;
  document.getElementById('animRange').value=db.animLevel;
  document.getElementById('webhookUrl').value=db.webhookUrl||'';
  document.getElementById('binId').value=db.binId||'';
  document.getElementById('binKey').value=db.binKey||'';
  renderHome();renderMemories();renderSpace();renderChat();
  renderGallery();renderEvents();renderJar();renderBucket();
  renderLetters();renderSongs();renderGiftDays();applyAnimLevel();
}
</script>
</body>
